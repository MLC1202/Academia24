; Config de PHP do projeto. Espelha o que deve estar ligado na Hostinger
; (hPanel > Avancado > Configuracao do PHP).

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

date.timezone = America/Sao_Paulo

; Sessao: so por cookie, cookie invisivel pro JS, sem aceitar ID inventado.
; O "Secure" e ligado pelo codigo quando APP_ENV nao e "dev" (local e http).
; gc_maxlifetime = 30 min, igual a sessao ociosa do codigo (src/sessao.php).
session.use_strict_mode = 1
session.gc_maxlifetime = 1800
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict

; A API so recebe JSON pequeno (o Excel e lido no navegador).
post_max_size = 2M
upload_max_filesize = 2M
file_uploads = Off
